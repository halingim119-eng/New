<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search scriot</title><style>:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#fff}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #eceef0}nav{max-width:1080px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between}nav b{font-size:19px;letter-spacing:-.04em}nav span{color:#73777c;font-size:13px}main{max-width:1080px;margin:auto;padding:54px 24px 90px}.intro{max-width:680px}h1{font-size:clamp(30px,5vw,43px);letter-spacing:-.055em;line-height:1.25;margin:0 0 12px}p{line-height:1.6;color:#697077;margin:0}.searchbox{margin-top:28px;display:flex;border:1px solid #d9dde1;border-radius:12px;padding:6px;max-width:760px;box-shadow:0 1px 3px #0000000a}.searchbox:focus-within{border-color:#8a9199}.searchbox input{border:0;outline:0;min-width:0;flex:1;padding:11px 13px;font:inherit;font-size:16px}.searchbox button,.primary{background:#25282b;color:#fff;border-color:#25282b}.searchbox button{padding:11px 23px}.options{display:flex;align-items:center;gap:9px;margin-top:15px;color:#50565b;font-size:14px}input[type=checkbox]{accent-color:#25282b;width:16px;height:16px}button{font:inherit;font-size:14px;border:1px solid #dadddf;border-radius:8px;background:#fff;color:#303438;cursor:pointer;padding:9px 13px}button:hover{background:#f4f5f6}.primary:hover,.searchbox button:hover{background:#42464b}button:disabled{opacity:.5;cursor:not-allowed}.workspace{margin-top:54px;border-top:1px solid #e7e9eb;padding-top:28px}.workhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.workhead h2{font-size:19px;letter-spacing:-.03em;margin:0 0 5px}.workhead p{font-size:14px}.tools{display:flex;gap:8px;flex-wrap:wrap}.notice{margin-top:22px;background:#f7f8f9;border:1px solid #eceeef;border-radius:10px;padding:15px 17px;font-size:14px;color:#5e666d;white-space:pre-wrap}.notice.error{background:#fff6f5;border-color:#f3d5d0;color:#a53c2e}.stats{display:flex;gap:28px;flex-wrap:wrap;padding:24px 0 8px;color:#747a80;font-size:13px}.stats strong{display:block;font-size:22px;line-height:1.4;color:#24282c;font-weight:650}.results{margin-top:12px}.empty{text-align:center;border:1px dashed #e3e6e8;border-radius:12px;padding:52px 16px;color:#94999d;font-size:14px}.item{border-top:1px solid #eceeef;padding:19px 0}.item-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}.item-title{font-size:14px;font-weight:650;color:#272b2f;overflow-wrap:anywhere}.state{font-size:12px;white-space:nowrap;padding:4px 8px;background:#f3f4f5;border-radius:5px;color:#697077}.state.done{background:#edf8f0;color:#39834b}.state.error{background:#fdf1ef;color:#b54c40}.source{font-size:13px;margin-top:7px;color:#8a9095;overflow-wrap:anywhere}.item a{color:#3a65a5;overflow-wrap:anywhere}.result-text{margin:13px 0 0;padding:14px;border:1px solid #e6e8eb;background:#f8f9fa;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:330px;overflow:auto}.item-actions{display:flex;gap:8px;margin-top:12px}.item-actions button{font-size:12px;padding:6px 9px}.error-text{color:#b54c40;font-size:13px;margin-top:9px}.sr{position:absolute;left:-9999px}@media(max-width:600px){nav{padding:18px}main{padding:38px 18px 70px}.workspace{margin-top:38px}.searchbox button{padding:10px 16px}.tools{width:100%}.stats{gap:24px}.item-head{gap:5px}}.intro{max-width:760px;margin:0 auto;text-align:center;padding-top:22px}.searchbox{margin:30px auto 0;max-width:650px;border-radius:999px;padding:5px 6px 5px 20px;box-shadow:0 2px 8px #20212412;align-items:center}.searchbox:hover,.searchbox:focus-within{box-shadow:0 3px 14px #20212420}.searchbox svg{color:#899096;flex:0 0 auto}.searchbox button{border-radius:999px;padding:11px 24px}.options{justify-content:center}.workspace{max-width:760px;margin:44px auto 0}.stats{justify-content:flex-start}@media(max-width:600px){.intro{padding-top:12px}.searchbox{padding-left:15px}.searchbox button{padding:10px 17px}.workspace{margin-top:38px}}.intro h1{font-size:clamp(42px,7.5vw,68px);line-height:1.16}.intro p{font-size:16px}.searchbox{max-width:760px;padding-top:8px;padding-bottom:8px}.searchbox input{font-size:18px;padding-top:15px;padding-bottom:15px}.searchbox button{font-size:16px;padding:13px 27px}@media(max-width:600px){.intro h1{font-size:42px}.searchbox input{font-size:16px}.searchbox button{font-size:14px;padding:12px 18px}}</style></head><body><main><section class="intro"><h1>로블록스<br>스크립트 검색</h1><p>검색하면 알아서 위에 뜹니다 :p</p><form id="searchForm" class="searchbox"><label for="query" class="sr">검색어</label><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg><input id="query" placeholder="게임 또는 스크립트 이름" autocomplete="off" required><button type="submit">검색</button></form></section><section class="workspace"><div class="workhead"><div><h2>검색 결과</h2><p>영상 150개를 찾으면 링크를 확인해요.</p></div><div class="tools"><button id="stop" disabled>중지</button><button id="run" disabled>바이패스</button><button id="copy" disabled>결과 복사</button><button id="save" disabled>TXT 저장</button></div></div><div id="notice" class="notice" role="status">게임 이름을 입력해 주세요.</div><div id="stats" class="stats" hidden><div>찾은 영상<strong id="videoCount">0 / 150</strong></div><div>확인한 영상<strong id="checkedCount">0</strong></div><div>찾은 링크<strong id="linkCount">0</strong></div><div>완료<strong id="doneCount">0</strong></div></div><div id="results" class="results"><div class="empty">아직 검색 결과가 없어요.</div></div></section></main><script>
const $=id=>document.getElementById(id);let state={items:[],videos:0,checked:0,controller:null,queue:[],active:0,runId:0};const allow=['link-center','linkvertise.com','pastebin.com','script','pastefy'],blocked=['rekonise.com','www.roblox.com','whatsapp.com','discord.gg','discord.com','discordapp.com'];function escapeHtml(s){let e=document.createElement('div');e.textContent=String(s||'');return e.innerHTML}function status(s,error=false){$('notice').textContent=s;$('notice').className='notice'+(error?' error':'')}function api(path,opt={}){return fetch('/api/'+path,{...opt,signal:state.controller?.signal}).then(async r=>{let t=await r.text(),j;try{j=JSON.parse(t)}catch{j={error:'서버가 JSON이 아닌 응답을 보냈어요 (HTTP '+r.status+'): '+t.slice(0,500)}}if(!r.ok)throw Error(j.error||'요청 실패 (HTTP '+r.status+')');return j})}function urls(t){return [...new Set((String(t||'').match(/https?:\/\/[^\s<>"'`]+/gi)||[]).map(s=>s.replace(/[.,;:!?)\]}>]+$/g,'')))].filter(x=>{try{let u=new URL(x),v=x.toLowerCase();return ['https:','http:'].includes(u.protocol)&&allow.some(a=>v.includes(a))&&!blocked.some(a=>v.includes(a))}catch{return false}})}function render(){let items=state.items;$('videoCount').textContent=state.videos+' / 150';$('checkedCount').textContent=state.checked;$('linkCount').textContent=items.length;$('doneCount').textContent=items.filter(x=>x.state==='완료').length;$('run').disabled=!items.some(x=>x.state==='대기'||x.state==='실패');$('copy').disabled=!items.some(x=>x.state==='완료');$('save').disabled=!items.some(x=>x.state==='완료');$('results').innerHTML=items.length?items.map((x,i)=>({x,i})).sort((a,b)=>Number(b.x.state==='완료')-Number(a.x.state==='완료')||a.i-b.i).map(({x,i})=>`<article class="item"><div class="item-head"><div class="item-title">${i+1}. ${escapeHtml(x.title)}</div><span class="state ${x.state==='완료'?'done':x.state==='실패'?'error':''}">${escapeHtml(x.state)}</span></div><div class="source">${escapeHtml(x.channel)}${x.date?' · '+escapeHtml(x.date.slice(0,10)):''}</div>${x.text!==undefined?'<pre class="result-text">'+escapeHtml(x.text)+'</pre>':'<div class="source"><a target="_blank" rel="noopener noreferrer" href="'+escapeHtml(x.output||x.url)+'">'+escapeHtml(x.output||x.url)+'</a></div>'}${x.error&&!/\b1016\b/.test(x.error)?'<div class="error-text">'+escapeHtml(x.error)+'</div>':''}${x.state==='완료'?'<div class="item-actions"><button data-copy="'+i+'">내용 복사</button></div>':''}</article>`).join(''):'<div class="empty">'+(state.videos?'아직 찾은 링크가 없어요.':'아직 검색 결과가 없어요.')+'</div>'}function content(x){return x.text!==undefined?x.text:x.output||x.url}function result(){return state.items.filter(x=>x.state==='완료').map((x,i)=>`[${i+1}] ${x.title}${x.date?' ('+x.date.slice(0,10)+')':''}\n${content(x)}`).join('\n\n')}async function copy(s){try{await navigator.clipboard.writeText(s);status('복사했어요.')}catch{status('복사할 수 없어요. 브라우저의 복사 권한을 확인해 주세요.',true)}}$('results').onclick=e=>{let i=e.target.dataset.copy;if(i!==undefined)copy(content(state.items[+i]))};$('copy').onclick=()=>copy(result());$('save').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([result()],{type:'text/plain;charset=utf-8'}));a.download='search-scriot.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};async function parallel(arr,max,fn){let i=0;await Promise.all(Array.from({length:Math.min(max,arr.length)},async()=>{while(i<arr.length){let x=arr[i++];await fn(x)}}))}function enqueue(x){if(x.state!=='대기'&&x.state!=='실패')return;x.state='대기열';x.error='';state.queue.push(x);$('stop').disabled=false;pump()}function pump(){while(state.active<10&&state.queue.length){let x=state.queue.shift(),runId=state.runId;state.active++;x.state='처리 중';render();bypass(x).catch(e=>{x.state='실패';x.error=e.name==='AbortError'?'중지됨':e.message}).finally(()=>{if(runId===state.runId){state.active--;if(!state.active&&!state.queue.length)$('stop').disabled=true;render();pump()}})}}async function bypass(x){let u=x.url;for(let i=0;i<6;i++){let host=new URL(u).hostname.toLowerCase();if(host==='pastebin.com'||host==='www.pastebin.com'){x.text=(await api('paste-content?url='+encodeURIComponent(u))).text;x.state='완료';return}if(host==='pastefy.app'||host==='www.pastefy.app'){x.output=u;x.state='완료';return}let j=await api('bypass',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:u})}),deadline=Date.now()+300000;while(j.pending){if(Date.now()>deadline)throw Error('바이패스 응답 시간이 초과됐어요.');await new Promise(r=>setTimeout(r,2500));j=await api('bypass?id='+encodeURIComponent(j.id))}if(!j.url||j.url===u)throw Error('유효한 결과 링크를 받지 못했어요.');u=j.url}throw Error('6단계 안에 결과에 도달하지 못했어요.')}async function start(q){state.controller?.abort();state={items:[],videos:0,checked:0,controller:new AbortController(),queue:[],active:0,runId:state.runId+1};$('stats').hidden=false;$('stop').disabled=false;render();try{let suffix=['','script','roblox script','ui script','gui','hub','pastebin','script mobile','script keyless','script no key','script showcase','script new','script 2026','script 2025','script pastefy','script pastebin','script linkvertise','auto farm script','script tutorial','script working','script free','script update','script download','script exploit','roblox gui','roblox hub','mobile exploit','script paste','best script','script roblox mobile','script executor','script key','script 2024','script op','script english','script 2026 mobile'],seen=new Set(),videos=[],failures=0,terms=suffix.filter(term=>!term||!q.toLowerCase().includes(term));for(let i=0;i<terms.length&&videos.length<150;i+=4){let batch=terms.slice(i,i+4);status(`영상 찾는 중 · ${videos.length} / 150 · 검색 ${Math.min(i+batch.length,terms.length)} / ${terms.length}`);let results=await Promise.all(batch.map(async term=>{try{return await api('search?q='+encodeURIComponent(q+(term?' '+term:''))+'&max=50')}catch(e){if(e.name==='AbortError')throw e;failures++;return {items:[]}}}));for(let r of results)for(let v of r.items||[]){if(!seen.has(v.id)&&videos.length<150){seen.add(v.id);videos.push(v)}}state.videos=videos.length;render()}if(videos.length<150){status(`중복을 제외한 영상 ${videos.length}개를 찾았어요. 검색 ${terms.length}회 중 오류 ${failures}회 · 영상 150개가 확보되지 않아 링크 검사를 시작하지 않았어요.`,true);return}status('영상 150개를 찾았어요. 설명과 댓글을 확인하고 있어요.');let info=[];for(let i=0;i<videos.length;i+=50){let data=await api('videos?ids='+encodeURIComponent(videos.slice(i,i+50).map(v=>v.id).join(',')));info.push(...(data.items||[]))}let known=new Map(),errors=0;await parallel(info,6,async d=>{try{if(!(''+d.title+' '+d.description).toLowerCase().includes('script'))return;let links=urls(d.description);{try{let c=await api('video?id='+encodeURIComponent(d.id));for(let x of c.comments||[])if(x.authorChannelId&&x.authorChannelId===d.channelId)links.push(...urls(x.body))}catch(e){if(e.name==='AbortError')throw e;errors++}}for(let url of links){let old=known.get(url);if(old){if(d.date>old.date)old.date=d.date;continue}let item={url,title:d.title,channel:d.channel,date:d.date||'',state:'대기'};known.set(url,item);state.items.push(item);enqueue(item)}}finally{state.checked++;render()}});status(`영상 ${videos.length}개 중 ${info.length}개의 정보를 확인했어요. 링크 ${state.items.length}개${errors?' · 댓글 확인 실패 '+errors+'개':''}`);if(info.length<150)status(`영상 150개 중 ${info.length}개의 정보만 가져왔어요. 비공개 또는 삭제된 영상이 있을 수 있어요. 링크 ${state.items.length}개`,true)}catch(e){if(e.name==='AbortError')status('작업을 중지했어요.');else status(e.message,true)}finally{$('stop').disabled=!(state.active||state.queue.length);render()}}$('searchForm').onsubmit=e=>{e.preventDefault();let q=$('query').value.trim();if(q)start(q)};$('stop').onclick=()=>{state.controller?.abort();state.queue.forEach(x=>x.state='대기');state.queue=[];status('작업을 중지했어요.');render()};$('run').onclick=()=>{if(state.controller?.signal.aborted)state.controller=new AbortController();state.items.forEach(enqueue);render()};
</script></body></html>
